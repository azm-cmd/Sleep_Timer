name: Build iOS IPA (Unsigned)

# Manual only: this produces an unsigned .app packaged as a .ipa, intended
# to be signed afterward on your own machine (e.g. with Sideloadly). There's
# no reason to run it on every push, so it's dispatch-only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: SleepTimer.xcodeproj
  SCHEME: SleepTimer
  CONFIGURATION: Release
  APP_NAME: SleepTimer
  ARCHIVE_PATH: build/ios/SleepTimer.xcarchive
  IPA_DIR: build/ios
  IPA_PATH: build/ios/SleepTimer.ipa
  LOG_DIR: build/logs

jobs:
  build:
    name: Archive & package unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select an Xcode 26.x toolchain (iOS/watchOS 26 SDK required)
        run: |
          set -euo pipefail
          echo "Xcode installations on this runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          # This project's deployment target is iOS/watchOS 26.0, which requires
          # the SDK that ships with Xcode 26.x. GitHub's macOS runners currently
          # default xcode-select to an older Xcode (e.g. 16.x) even when newer
          # 26.x versions are installed side-by-side, so we must select explicitly.
          # We deliberately pick the newest *installed, non-beta* Xcode rather than
          # downloading one: downloading a new Xcode normally requires an Apple ID
          # login, which this workflow must not depend on.
          shopt -s nullglob
          candidates=(/Applications/Xcode_*.app)
          shopt -u nullglob

          stable_candidates=()
          for candidate in "${candidates[@]}"; do
            case "$candidate" in
              *[Bb]eta*) continue ;;
            esac
            stable_candidates+=("$candidate")
          done

          if [ "${#stable_candidates[@]}" -eq 0 ]; then
            echo "::error::No non-beta /Applications/Xcode_*.app installations found on this runner. Cannot select a toolchain."
            exit 1
          fi

          SELECTED_XCODE="$(printf '%s\n' "${stable_candidates[@]}" | sort -V | tail -n 1)"

          echo "Selecting: $SELECTED_XCODE"
          sudo xcode-select -s "$SELECTED_XCODE"

      - name: Show build environment
        run: |
          echo "== xcode-select path =="
          xcode-select -p
          echo
          echo "== Xcode version =="
          xcodebuild -version
          echo
          echo "== Swift version =="
          swift --version
          echo
          echo "== Available SDKs =="
          xcodebuild -showsdks
          echo
          echo "== Selected build parameters =="
          echo "Project:       $PROJECT_PATH"
          echo "Scheme:        $SCHEME"
          echo "Configuration: $CONFIGURATION"
          echo "Archive path:  $ARCHIVE_PATH"
          echo "IPA path:      $IPA_PATH"

      - name: List project schemes (sanity check)
        run: xcodebuild -project "$PROJECT_PATH" -list

      - name: Show resolved build settings (diagnostics)
        run: |
          xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration "$CONFIGURATION" -showBuildSettings \
            | grep -E "PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|IPHONEOS_DEPLOYMENT_TARGET|MARKETING_VERSION|CODE_SIGN|SDKROOT" \
            || true

      - name: Create output directories
        run: mkdir -p "$IPA_DIR" "$LOG_DIR"

      - name: Archive (unsigned — no certificates/profiles/Apple ID involved)
        run: |
          set -o pipefail
          # CODE_SIGNING_ALLOWED=NO skips every codesign invocation for the whole
          # build graph, including the embedded "SleepTimer Watch App" target that
          # the iOS app depends on (via its "Embed Watch Content" build phase) —
          # so the watch target does not need its own signing configuration here.
          # -destination "generic/platform=iOS" builds for a real device (arm64),
          # not the Simulator, and needs no physical device or simulator attached.
          #
          # CURRENT_PROJECT_VERSION is overridden to this run's unique,
          # monotonically increasing GITHUB_RUN_NUMBER (applies to every
          # target in the build graph, main app and the SleepTimerWidgets
          # extension alike, since it's a single xcodebuild invocation) —
          # the checked-in project has it hardcoded to "1" for every target,
          # which every sideloaded rebuild this project has ever produced has
          # therefore shared. A widget/Live Activity extension's registration
          # with iOS is known to go stale across reinstalls when the build
          # number never changes, particularly for sideloaded (personal-team)
          # installs that keep reusing the same signing identity - this
          # override is what actually forces each install to be recognized
          # as new.
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tee "$LOG_DIR/archive.log"

      - name: Verify archive was produced
        run: |
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "::error::Expected archive at $ARCHIVE_PATH was not produced. See archive.log."
            exit 1
          fi
          echo "Archive contents:"
          find "$ARCHIVE_PATH" -maxdepth 4

      - name: Verify the Live Activity widget extension was embedded
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/${APP_NAME}.app"
          EXTENSION_PATH="$APP_PATH/PlugIns/SleepTimerWidgets.appex"

          # This is the step most likely to catch a silent Live Activity
          # failure at the source: the extension's "Embed Foundation
          # Extensions" copy-files build phase resolving correctly is the
          # one part of the widget-extension target that was assembled by
          # hand with the xcodeproj gem (no Xcode wizard available in that
          # environment) and could never be exercised by an actual build
          # until this workflow runs. If it's silently missing here, Live
          # Activities cannot possibly appear on-device no matter how
          # correct SleepTimerActivityController/the widget's own UI code
          # are - so fail loudly instead of producing an IPA that looks
          # fine but can never show one.
          if [ ! -d "$EXTENSION_PATH" ]; then
            echo "::error::SleepTimerWidgets.appex was not found at $EXTENSION_PATH. The widget extension did not get embedded into the app — Live Activities cannot work in this build."
            echo "Contents of $APP_PATH:"
            find "$APP_PATH" -maxdepth 2
            exit 1
          fi

          echo "Confirmed: SleepTimerWidgets.appex is embedded at $EXTENSION_PATH"
          echo "Extension bundle contents:"
          find "$EXTENSION_PATH" -maxdepth 2

          INFO_PLIST="$EXTENSION_PATH/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            echo
            echo "Extension Info.plist NSExtensionPointIdentifier:"
            /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$INFO_PLIST" 2>/dev/null || \
              echo "::warning::Could not read NSExtensionPointIdentifier from $INFO_PLIST"
          else
            echo "::warning::No Info.plist found at $INFO_PLIST"
          fi

          echo
          echo "Main app Info.plist NSSupportsLiveActivities:"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP_PATH/Info.plist" 2>/dev/null || \
            echo "::error::NSSupportsLiveActivities is not set (or not YES) in the main app's Info.plist — Live Activities will not work even with the extension embedded."

          echo
          echo "Main app CFBundleVersion (should equal this run's GITHUB_RUN_NUMBER, $GITHUB_RUN_NUMBER):"
          APP_BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist" 2>/dev/null || true)"
          echo "$APP_BUNDLE_VERSION"
          echo "Extension CFBundleVersion (must match the main app's, or Xcode itself refuses/warns and iOS may misregister the extension):"
          EXTENSION_BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST" 2>/dev/null || true)"
          echo "$EXTENSION_BUNDLE_VERSION"

          # This exact mismatch (extension's CFBundleVersion hardcoded to a
          # literal "1" in SleepTimerWidgets/Info.plist instead of the
          # $(CURRENT_PROJECT_VERSION) variable every other target picks up
          # automatically) is what caused every sideloaded build before this
          # fix to carry a permanently stale build number for the widget
          # extension specifically, regardless of what the app's own version
          # was - a real, confirmed contributor to Live Activities silently
          # never appearing. Comparing here, not just printing, so a
          # regression fails loudly instead of passing as a mere Xcode
          # warning buried in the full build log.
          if [ -z "$APP_BUNDLE_VERSION" ] || [ -z "$EXTENSION_BUNDLE_VERSION" ]; then
            echo "::warning::Could not read CFBundleVersion from one or both Info.plists — skipping the match check."
          elif [ "$APP_BUNDLE_VERSION" != "$EXTENSION_BUNDLE_VERSION" ]; then
            echo "::error::CFBundleVersion mismatch: main app is '$APP_BUNDLE_VERSION', extension is '$EXTENSION_BUNDLE_VERSION'. They must match — Xcode itself warns about exactly this, and it can cause iOS to misregister the extension."
            exit 1
          else
            echo "Confirmed: main app and extension CFBundleVersion match ($APP_BUNDLE_VERSION)."
          fi

      - name: Package unsigned .ipa from the archive
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/${APP_NAME}.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected app bundle at $APP_PATH was not found in the archive."
            echo "Archive Products/Applications contents:"
            find "$ARCHIVE_PATH/Products" -maxdepth 3 2>/dev/null || echo "(no Products directory)"
            exit 1
          fi

          # An .ipa is just a zip with the .app under a top-level "Payload/" folder.
          # We build that by hand instead of `xcodebuild -exportArchive`, because
          # export requires a signing identity/provisioning profile — exactly what
          # this workflow must not depend on. Sideloadly signs the app afterward.
          PACKAGE_ROOT="$(mktemp -d)"
          PAYLOAD_DIR="$PACKAGE_ROOT/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          # Strip the embedded Watch app before packaging. Sideloadly (free-tier,
          # personal-team signing) cannot pair/install a companion Watch app onto
          # a physically paired Apple Watch in the first place - only Xcode or the
          # App Store can do that - so it does nothing useful here. Worse, when
          # Sideloadly re-signs with a free Apple ID it commonly has to append a
          # random suffix to the bundle ID to avoid an App ID conflict on your
          # personal team (e.g. com.azm.SleepTimer -> com.azm.SleepTimer.VZ3XGS45FB).
          # Our build-time IPA can't predict that suffix, so the Watch app's
          # already-baked-in WKCompanionAppBundleIdentifier (still the original,
          # un-suffixed ID) no longer matches the resigned parent app, and iOS
          # refuses the whole install with InvalidCompanionAppBundleIdentifier.
          # Removing the Watch app avoids that check entirely; the iPhone app is
          # unaffected either way.
          EMBEDDED_WATCH_APP="$PAYLOAD_DIR/${APP_NAME}.app/Watch"
          if [ -d "$EMBEDDED_WATCH_APP" ]; then
            echo "Removing embedded Watch app before packaging: $EMBEDDED_WATCH_APP"
            rm -rf "$EMBEDDED_WATCH_APP"
          else
            echo "No embedded Watch app found at $EMBEDDED_WATCH_APP (nothing to strip)."
          fi

          (cd "$PACKAGE_ROOT" && zip -r -y -q "$GITHUB_WORKSPACE/$IPA_PATH" "Payload")

      - name: Verify IPA was produced
        run: |
          set -euo pipefail
          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::Expected IPA at $IPA_PATH was not produced."
            exit 1
          fi
          echo "== IPA file =="
          ls -la "$IPA_PATH"
          echo
          echo "== IPA top-level contents =="
          unzip -l "$IPA_PATH" | head -20
          echo
          echo "== Confirming the widget extension survived packaging =="
          if unzip -l "$IPA_PATH" | grep -q "Payload/${APP_NAME}.app/PlugIns/SleepTimerWidgets.appex/"; then
            echo "Confirmed: PlugIns/SleepTimerWidgets.appex is present in the packaged IPA."
          else
            echo "::error::PlugIns/SleepTimerWidgets.appex is missing from the packaged IPA. It was present in the archive but was lost while packaging — Live Activities cannot work in this build."
            exit 1
          fi

      - name: Verify the app icon was compiled into the build
        run: |
          APP_PATH="$ARCHIVE_PATH/Products/Applications/${APP_NAME}.app"
          ASSETS_CAR="$APP_PATH/Assets.car"

          if [ ! -f "$ASSETS_CAR" ]; then
            echo "::warning::No Assets.car found in $APP_PATH — the asset catalog may not have been included."
            exit 0
          fi

          echo "Assets.car found: $ASSETS_CAR"
          if xcrun assetutil --info "$ASSETS_CAR" > "$LOG_DIR/assetutil.json" 2>/dev/null; then
            if grep -qi "AppIcon" "$LOG_DIR/assetutil.json"; then
              echo "Confirmed: compiled asset catalog references 'AppIcon'."
            else
              echo "::warning::Assets.car was found but no 'AppIcon' entry was detected in it."
            fi
          else
            echo "::warning::assetutil could not inspect Assets.car; skipping icon content verification (file presence only)."
          fi

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SleepTimer-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SleepTimer-build-logs
          path: |
            build/logs/**
            build/ios/SleepTimer.xcarchive/Info.plist
          if-no-files-found: warn
          retention-days: 14
